[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-compute"
version = "2.0.0"
description = "Command-line client for Distributed Compute: run folders of code on your own machines over SSH"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dc = "distributed_compute.cli:main"

[tool.setuptools]
packages = ["distributed_compute"]
