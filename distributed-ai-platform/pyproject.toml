[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ai-platform"
version = "2.0.0"
description = "Agentless SSH distributed compute platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[project.optional-dependencies]
dev = [
    # Test / lint tooling
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "locust==2.29.1",
    "ruff==0.5.0",
    "mypy==1.10.1",
    "bandit==1.7.9",
    "safety==3.2.3",
    # Runtime deps needed to import and unit-test storage-service and
    # ssh-executor in-process (pins match services/*/pyproject.toml).
    # No pyspark/ray: training is pure Python on the master (commit 52b210f).
    "fastapi==0.111.1",
    "sqlalchemy[asyncio]==2.0.31",
    "asyncpg==0.29.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "httpx==0.27.0",
    "pyjwt==2.8.0",
    "python-multipart==0.0.9",
    "Pillow==10.4.0",
    "paramiko>=3.4.0",
    "cryptography>=42.0.0",
    "onnx==1.16.1",
    "numpy==1.26.4",
    # In-memory SQLite engine for the storage-service ownership tests.
    "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
# Non-strict until the services are typed; `make lint` checks shared/ only.
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
