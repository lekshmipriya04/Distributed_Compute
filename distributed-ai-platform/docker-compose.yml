# Every published port listens on this machine only. To reach the dashboard or
# the VS Code gateway from another computer on your network, run
#   BIND_ADDR=0.0.0.0 docker compose up -d
# Worker nodes never connect in: the master connects out to them over SSH.
networks:
  platform-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # ==========================================
  # Core Infrastructure
  # ==========================================
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-platform_db}
    # Bound to loopback so the database is not reachable from the LAN.
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5433}:5432"
    networks:
      - platform-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    # BUG-11 fix: healthcheck so dependent services wait for Postgres to be ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

 
  # --- Optional HDFS (profile "hdfs") ----------------------------------------
  # Not started by default: datasets are stored as files in the `datasets`
  # volume. For an existing HDFS setup, or to move old datasets out of it:
  # `make up-hdfs` / `make migrate-datasets`.
  namenode:
    image: apache/hadoop:3
    container_name: namenode
    profiles: ["hdfs"]
    restart: unless-stopped
    user: root
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      # The JVM default (1/4 of RAM) is far more than this workload needs and
      # gets containers OOM-killed on 8 GB machines.
      - HADOOP_HEAPSIZE_MAX=512m
    command: >
      bash -c "if [ ! -d /hadoop/dfs/name/current ]; then hdfs namenode -format platform -force -nonInteractive; fi && hdfs namenode"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9870:9870"
      - "${BIND_ADDR:-127.0.0.1}:9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: creates the HDFS folders the platform uses, then exits. Runs on
  # every start and is idempotent.
  hdfs-init:
    image: apache/hadoop:3
    container_name: hdfs-init
    profiles: ["hdfs"]
    user: root
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HADOOP_USER_NAME=root
    command: >
      bash -c "hdfs dfsadmin -safemode wait &&
      hdfs dfs -mkdir -p /platform/raw /platform/processed /platform/models /platform/logs &&
      hdfs dfs -chmod -R 777 /platform"
    volumes:
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net
    restart: "no"
    depends_on:
      namenode:
        condition: service_healthy

  datanode-1:
    image: apache/hadoop:3
    container_name: datanode-1
    profiles: ["hdfs"]
    restart: unless-stopped
    hostname: datanode-1
    # Data dir is a named volume owned by root; the datanode enforces
    # dfs.datanode.data.dir.perm (700) via chmod on startup, which the image's
    # non-root `hadoop` user cannot do on a root-owned mount (EPERM -> volume
    # marked failed -> datanode exits). Running as root lets the chmod succeed.
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      # The JVM default (1/4 of RAM) is far more than this workload needs and
      # gets containers OOM-killed on 8 GB machines.
      - HADOOP_HEAPSIZE_MAX=256m
    volumes:
      - hadoop_datanode_1:/hadoop/dfs/data
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net

  datanode-2:
    image: apache/hadoop:3
    container_name: datanode-2
    profiles: ["hdfs"]
    restart: unless-stopped
    hostname: datanode-2
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      # The JVM default (1/4 of RAM) is far more than this workload needs and
      # gets containers OOM-killed on 8 GB machines.
      - HADOOP_HEAPSIZE_MAX=256m
    volumes:
      - hadoop_datanode_2:/hadoop/dfs/data
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net

  datanode-3:
    image: apache/hadoop:3
    container_name: datanode-3
    profiles: ["hdfs"]
    restart: unless-stopped
    hostname: datanode-3
    user: root
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      # The JVM default (1/4 of RAM) is far more than this workload needs and
      # gets containers OOM-killed on 8 GB machines.
      - HADOOP_HEAPSIZE_MAX=256m
    volumes:
      - hadoop_datanode_3:/hadoop/dfs/data
      - ./infrastructure/docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./infrastructure/docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    networks:
      - platform-net

  # ==========================================
  # Microservices
  # BUG-10 fix: use config/.env (not config/.env.example) for real secret values
  # BUG-11 fix: all services use condition: service_healthy on infra dependencies
  # api-gateway depends_on every downstream service it proxies to
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - config/.env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      storage-service:
        condition: service_healthy
      ssh-executor:
        condition: service_healthy

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: storage-service
    env_file:
      - config/.env
    environment:
      # "local" (files in the datasets volume, the default) or "hdfs".
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8001:8001"
    volumes:
      - datasets:/data
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # Only with the "hdfs" profile; ignored otherwise.
      namenode:
        condition: service_healthy
        required: false
      hdfs-init:
        condition: service_completed_successfully
        required: false

  ssh-executor:
    build:
      context: .
      dockerfile: services/ssh-executor/Dockerfile
      # Optional Spark + Ray engine (master only). `make enable-spark-ray`
      # sets WITH_SPARK_RAY=true in .env next to this file and rebuilds.
      args:
        WITH_SPARK_RAY: ${WITH_SPARK_RAY:-false}
    image: distributed-compute/ssh-executor:${WITH_SPARK_RAY:-false}
    pull_policy: build
    # Ray keeps objects in shared memory; Docker's 64 MB default makes it
    # fall back to slow disk.
    shm_size: 2gb
    container_name: ssh-executor
    # Lets a worker on this same computer be added as host.docker.internal
    # (built into Docker Desktop; this line adds it on Linux Docker Engine).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SSH_CRED_KEY (at-rest encryption key for stored SSH credentials, see
    # crypto.py) and JWT_SECRET come from config/.env; there is no default.
    env_file:
      - config/.env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8011:8011"
    networks:
      - platform-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Go gateway for the VS Code extension; forwards to ssh-executor.
  extension-gateway:
    build:
      context: .
      dockerfile: services/extension-gateway/Dockerfile
    container_name: extension-gateway
    env_file:
      - config/.env
    environment:
      - LISTEN_ADDR=:8090
      - UPSTREAM_URL=http://ssh-executor:8011
      - STORAGE_URL=http://storage-service:8001
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8090:8090"
    networks:
      - platform-net
    restart: unless-stopped
    # Healthcheck is defined in the image (the binary probes its own /health).
    depends_on:
      ssh-executor:
        condition: service_healthy

  # Web dashboard: nginx serves the built SPA and proxies /api + /health to
  # api-gateway on the same origin. Open http://localhost:3001 (FRONTEND_PORT).
  frontend:
    build:
      context: frontend
    container_name: frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3001}:80"
    networks:
      - platform-net
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy

  # Throwaway provider node for local end-to-end testing of SSH resource
  # sharing: runs only sshd + python3, exactly the "provider runs nothing but
  # sshd" model. Login: provider / providerpass. NOT for production use.
  # Only started with `docker compose --profile dev up`.
  ssh-provider:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-provider
    profiles: ["dev"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER_NAME=provider
      - USER_PASSWORD=providerpass
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=false
      # Install python3 + coreutils (nice/taskset/timeout) at startup so the
      # master can run tasks and pin them to the allocated cores.
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=python3|coreutils|util-linux
    networks:
      - platform-net

  # Second isolated provider for multi-node SSH training tests. Reachable by
  # ssh-executor as ssh-provider-2:2222; intentionally not published on host.
  ssh-provider-2:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: ssh-provider-2
    profiles: ["dev"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER_NAME=provider
      - USER_PASSWORD=providerpass
      - PASSWORD_ACCESS=true
      - SUDO_ACCESS=false
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=python3|coreutils|util-linux
    networks:
      - platform-net


volumes:
  postgres_data:
  # Dataset files (STORAGE_BACKEND=local).
  datasets:
  hadoop_namenode:
  hadoop_datanode_1:
  hadoop_datanode_2:
  hadoop_datanode_3:
