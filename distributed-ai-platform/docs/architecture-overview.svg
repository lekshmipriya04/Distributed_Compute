<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Distributed Data Processing &amp; Task Execution Platform: architecture overview</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 10; }
      .client { fill: #eff6ff; stroke: #3b82f6; }
      .svc { fill: #f0fdf4; stroke: #16a34a; }
      .infra { fill: #fefce8; stroke: #ca8a04; }
      .worker { fill: #fdf2f8; stroke: #db2777; }
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 11.5px; fill: #334155; }
      .h { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
      .edge { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .ssh { stroke: #db2777; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 4; }
      .lbl { font-size: 11px; fill: #475569; }
    </style>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="24" y="34" class="t" style="font-size:18px">Distributed Data Processing &amp; Task Execution Platform</text>
  <text x="24" y="54" class="s">Master in Docker Compose · workers need only sshd + python3 · nothing installed on workers · Spark + Ray optional, master only</text>

  <text x="24" y="88" class="h">CLIENTS AND DATA</text>
  <rect x="24" y="98" width="250" height="64" class="box client"/>
  <text x="38" y="122" class="t">React web app (Vite :3000)</text>
  <text x="38" y="142" class="s">/ssh workers · /execute tasks · /train</text>
  <rect x="24" y="178" width="250" height="56" class="box infra"/>
  <text x="38" y="201" class="t">Dataset files (volume /data)</text>
  <text x="38" y="220" class="s">dataset bytes · HDFS optional</text>
  <rect x="24" y="270" width="250" height="64" class="box client"/>
  <text x="38" y="294" class="t">VS Code extension</text>
  <text x="38" y="314" class="s">nodes, slices, executions, run file</text>
  <rect x="24" y="382" width="250" height="56" class="box infra"/>
  <text x="38" y="405" class="t">PostgreSQL :5432</text>
  <text x="38" y="424" class="s">datasets, nodes, leases, batches, runs</text>

  <text x="330" y="88" class="h">MASTER SERVICES</text>
  <rect x="330" y="98" width="270" height="64" class="box svc"/>
  <text x="344" y="122" class="t">api-gateway :8000</text>
  <text x="344" y="142" class="s">proxy /api/v1/storage/* and /api/v1/ssh/*</text>
  <rect x="330" y="178" width="270" height="64" class="box svc"/>
  <text x="344" y="202" class="t">storage-service :8001</text>
  <text x="344" y="222" class="s">owner-scoped datasets · CSV / image ZIP</text>
  <rect x="330" y="270" width="270" height="64" class="box svc"/>
  <text x="344" y="294" class="t">extension-gateway :8090 (Go)</text>
  <text x="344" y="314" class="s">forwards with the caller's JWT</text>
  <rect x="330" y="350" width="270" height="110" class="box svc"/>
  <text x="344" y="374" class="t">ssh-executor :8011</text>
  <text x="344" y="394" class="s">password-once onboarding → managed key</text>
  <text x="344" y="412" class="s">runtime detection · sandboxed batches</text>
  <text x="344" y="430" class="s">leases · GPU slice · execution policy</text>
  <text x="344" y="448" class="s">pure-Python training · FedAvg · ONNX</text>

  <text x="660" y="88" class="h">WORKERS (YOUR MACHINES)</text>
  <rect x="660" y="98" width="276" height="362" class="box worker"/>
  <text x="676" y="124" class="t">sshd + python3 only</text>
  <text x="676" y="146" class="s">Linux · macOS · Windows (unverified)</text>
  <rect x="676" y="164" width="244" height="126" rx="8" fill="#ffffff" stroke="#f9a8d4"/>
  <text x="690" y="186" class="t" style="font-size:13px">/tmp/dp-exec.&lt;exec_id&gt;.XXXXXX</text>
  <text x="690" y="206" class="s">code · input.txt · dp_runner.py</text>
  <text x="690" y="224" class="s">clean env · own process group</text>
  <text x="690" y="242" class="s">nice · taskset · thread caps · timeout</text>
  <text x="690" y="260" class="s">GPU cap only if torch already present</text>
  <text x="690" y="278" class="s">deleted after every run / cancel</text>
  <text x="676" y="314" class="s">Any detected language: Python, Bash,</text>
  <text x="676" y="332" class="s">Node, Go, Rust, Java, C/C++, … custom</text>
  <text x="676" y="358" class="s">Lent slice: cores · memory · GPU memory</text>
  <text x="676" y="384" class="s">Only persistent trace: one line</text>
  <text x="676" y="402" class="s">restrict ssh-ed25519 … dp-platform:&lt;id&gt;</text>
  <text x="676" y="436" class="s">Sandbox isolates files and processes,</text>
  <text x="676" y="452" class="s">not the kernel.</text>

  <path d="M274 130 L326 130" class="edge"/>
  <path d="M274 302 L326 302" class="edge"/>
  <path d="M465 162 L465 174" class="edge"/>
  <text x="472" y="172" class="lbl">/storage</text>
  <path d="M600 130 C 640 130, 640 360, 604 372" class="edge"/>
  <text x="604" y="262" class="lbl">/ssh</text>
  <path d="M465 334 L465 346" class="edge"/>
  <path d="M330 206 L278 206" class="edge"/>
  <path d="M330 410 L278 410" class="edge"/>
  <path d="M600 425 L656 425" class="ssh"/>
  <text x="616" y="417" class="lbl">SSH</text>

  <text x="24" y="500" class="h">TRAINING FLOW</text>
  <text x="24" y="522" class="s">dataset (storage-service, on behalf of the owner) → master parses in pure Python → single: master processes · multi: leased workers,</text>
  <text x="24" y="540" class="s">shards sized by compute score → stdlib script + shard per worker sandbox → FedAvg per round → ONNX download</text>
  <text x="24" y="574" class="lbl">Removed: Spark, Livy, Ray, MLflow, Kafka, scheduler, worker registry, resource manager, worker agent, preprocessing/evaluation/registry/serving services.</text>
</svg>
