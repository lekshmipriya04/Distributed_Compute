[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-executor"
version = "1.0.1"
description = "Master-driven SSH resource sharing + parallel task execution"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy[asyncio]==2.0.31",
    "asyncpg==0.29.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "httpx==0.27.0",
    "pyjwt==2.8.0",
    "paramiko>=3.4.0",
    "cryptography>=42.0.0",
    "onnx==1.16.1",
    "numpy==1.26.4",
    "setuptools==69.5.1",
]

[project.optional-dependencies]
# Master-only big-data engine. Installed on the master container so the web
# dashboard's "spark_ray" engine can run Apache Spark sharding + Ray FedAvg.
# NEVER installed on worker nodes — workers stay zero-install (no JVM, no Spark,
# no Ray) and only ever receive a stdlib-only Python script over SSH.
spark_ray = [
    "pyspark==3.5.1",
    "ray[default]==2.31.0",
]
