[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "1.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "httpx==0.27.0",
    "pyjwt==2.8.0",
    "sse-starlette==2.1.2"
]
