name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. make up-dev\n2. Add ssh-provider as a worker\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Web dashboard, VS Code extension, Platform / Docker, Worker machine]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and OS
      placeholder: "2.0.0, macOS 15, Docker 28, VS Code 1.142, Firefox 140"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "VS Code: Distributed Compute: Show Diagnostics. Platform: docker compose logs ssh-executor. Remove secrets, tokens and passwords."
      render: text
