# Project files live under distributed-ai-platform/; paths below are relative
# to the repository root (GitHub only runs workflows from <root>/.github/workflows).
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-ai-platform
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: distributed-ai-platform/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint (ruff + mypy)
      run: make lint

    - name: Run unit tests (Spark/Ray tests skip without them)
      run: pytest tests/unit -v --cov=services --cov=shared --cov-report=xml

  # The optional master engine, exercised for real: Java 17, PySpark and Ray.
  spark-ray:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-ai-platform
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: |
          distributed-ai-platform/pyproject.toml
          distributed-ai-platform/services/ssh-executor/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" "pyspark==3.5.1" "ray[default]==2.31.0"

    - name: Run engine tests
      run: pytest tests/unit/services/test_ml_engines.py -v -rs

  # The dashboard builds and passes its unit tests on every desktop OS
  # (browser engines are covered by the e2e job).
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: distributed-ai-platform/frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: distributed-ai-platform/frontend/package-lock.json

    - name: Install, lint, test and build
      run: |
        npm ci
        npm run lint
        npm test
        npm run build

  # The extension on every desktop OS: unit tests, the packaged .vsix, and a
  # real VS Code that loads it (offline smoke test).
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: distributed-ai-platform/distributed-compute-vscode
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: distributed-ai-platform/distributed-compute-vscode/package-lock.json

    - name: Install, lint, test and package
      run: |
        npm ci
        npm run lint
        npm test
        npm run package -- --out distributed-ai-compute.vsix

    - name: Smoke test in VS Code (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm run test:vscode

    - name: Smoke test in VS Code (macOS, Windows)
      if: runner.os != 'Linux'
      run: npm run test:vscode

    - name: Keep the .vsix
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: distributed-ai-compute-vsix
        path: distributed-ai-platform/distributed-compute-vscode/distributed-ai-compute.vsix

  # The whole platform in Docker with the two test SSH workers: three users on
  # three gateway ports and three dashboard ports, VS Code and five browsers.
  e2e:
    runs-on: ubuntu-latest
    needs: [extension, frontend, go, python]
    defaults:
      run:
        working-directory: distributed-ai-platform
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: distributed-ai-platform/distributed-compute-vscode/package-lock.json

    - uses: actions/setup-go@v5
      with:
        go-version-file: distributed-ai-platform/services/extension-gateway/go.mod
        cache: false

    - name: Start the platform and the test workers
      run: |
        cp config/.env.example config/.env
        docker compose --profile dev up -d --build --wait --wait-timeout 600
        # The test workers install python3 on first start.
        for w in ssh-provider ssh-provider-2; do
          for i in $(seq 1 60); do docker exec $w python3 --version && break; sleep 5; done
        done

    - name: Start two more gateways (ports 8091, 8092)
      working-directory: distributed-ai-platform/services/extension-gateway
      run: |
        go build -o "$RUNNER_TEMP/egw" .
        for p in 8091 8092; do
          LISTEN_ADDR=127.0.0.1:$p UPSTREAM_URL=http://127.0.0.1:8011 STORAGE_URL=http://127.0.0.1:8001 \
            JWT_SECRET=change_me_in_production ENVIRONMENT=development \
            nohup "$RUNNER_TEMP/egw" > "$RUNNER_TEMP/egw-$p.log" 2>&1 &
        done
        for p in 8091 8092; do
          for i in $(seq 1 30); do curl -fs "http://127.0.0.1:$p/health" && break; sleep 1; done
        done

    - name: Multi-user end-to-end tests
      working-directory: distributed-ai-platform/distributed-compute-vscode
      run: |
        npm ci
        npm run test:e2e

    - name: VS Code against the gateway on port 8091
      working-directory: distributed-ai-platform/distributed-compute-vscode
      run: DC_E2E_URL=http://127.0.0.1:8091 xvfb-run -a npm run test:vscode

    - name: Website in Chromium, Firefox, WebKit and on phones (ports 4101-4103)
      working-directory: distributed-ai-platform/frontend
      run: |
        npm ci
        npx playwright install --with-deps chromium firefox webkit
        node e2e/serve.mjs
        npx playwright test

    - name: Keep the browser test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          distributed-ai-platform/frontend/playwright-report
          distributed-ai-platform/frontend/e2e-results

    - name: Logs on failure
      if: failure()
      run: |
        docker compose logs --tail 200 ssh-executor extension-gateway storage-service
        cat "$RUNNER_TEMP"/egw-*.log || true

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distributed-ai-platform/services/extension-gateway
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: distributed-ai-platform/services/extension-gateway/go.mod
        cache: false

    - name: Vet, test and build for every OS
      run: |
        go vet ./...
        go test ./...
        for os in linux darwin windows; do GOOS=$os GOARCH=amd64 go build -o /dev/null . ; done
        GOOS=darwin GOARCH=arm64 go build -o /dev/null .
